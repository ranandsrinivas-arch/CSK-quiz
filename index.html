<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSK Quiz - Multiple Choice Questions</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="quiz-header">
            <h1>🏏 CSK Quiz</h1>
            <div class="quiz-info">
                <span class="score">Score: <strong id="score">0</strong>/<strong id="total">0</strong></span>
                <span class="timer" id="timer">00:30</span>
            </div>
        </div>

        <div class="quiz-container" id="quizContainer">
            <div class="question-number">
                Question <span id="currentQuestion">1</span> of <span id="totalQuestions">0</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="media-section" id="mediaSection"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="navigation">
                <button id="prevBtn" class="btn btn-secondary" disabled>← Previous</button>
                <button id="nextBtn" class="btn btn-primary" disabled>Next →</button>
                <button id="submitBtn" class="btn btn-success" style="display: none;">Submit Quiz</button>
            </div>
        </div>

        <div class="results-screen" id="resultsScreen" style="display: none;">
            <h2>Quiz Complete! 🎉</h2>
            <div class="final-score">
                <p>Your Score: <strong id="finalScore">0</strong>/<strong id="finalTotal">0</strong></p>
                <p class="percentage" id="percentage"></p>
            </div>
            <button class="btn btn-primary" onclick="location.reload()">Retake Quiz</button>
        </div>
    </div>

    <script src="js/timer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
